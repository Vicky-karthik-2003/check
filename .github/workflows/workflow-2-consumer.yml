name: Workflow 2 Consumer

on:
  workflow_run:
    workflows:
      - Workflow 1 Producer
    types:
      - completed

jobs:
  consume-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact from Workflow 1
        uses: actions/download-artifact@v4
        with:
          name: workflow1-artifact
          path: ./artifact-data

      - name: Read artifact content
        run: |
          echo "===== Artifact Content ====="
          cat ./artifact-data/workflow1_output.txt
